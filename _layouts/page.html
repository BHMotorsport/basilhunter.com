<section class="page-hero">
  <div class="container">
    <p class="kicker">{{ page.kicker | default: site.tagline }}</p>

    {% if page.subtitle %}<p class="lede">{{ page.subtitle }}</p>{% endif %}
  </div>
</section>
<div class="container page-body">
  {{ content }}
</div>
